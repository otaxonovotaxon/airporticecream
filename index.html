<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airport Icecream</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#f3f3f3;color:#111}
.top{background:#fff;border-bottom:1px solid #eee;padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100}
.top img{height:44px;object-fit:contain;flex-shrink:0;max-width:130px}
.srch{flex:1;position:relative}
.srch input{width:100%;border:1.5px solid #e0e0e0;background:#f5f5f5;border-radius:10px;padding:9px 12px 9px 36px;font-size:14px;font-family:Inter,sans-serif;outline:none;color:#111}
.srch input:focus{border-color:#111;background:#fff}
.srch::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px}
.langs{display:flex;background:#f0f0f0;border-radius:8px;padding:3px;gap:2px;flex-shrink:0}
.ln{border:none;background:none;border-radius:6px;padding:5px 8px;font-size:11px;font-weight:700;cursor:pointer;color:#777;font-family:Inter,sans-serif}
.ln.on{background:#111;color:#fff}
.cbtn{width:42px;height:42px;background:#111;border:none;border-radius:10px;color:#fff;font-size:17px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cbadge{position:absolute;top:-5px;right:-5px;background:#e01;color:#fff;border-radius:50%;width:17px;height:17px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.flt{background:#fff;border-bottom:1px solid #eee;padding:8px 14px;display:flex;gap:8px;position:sticky;top:62px;z-index:99}
.sw{position:relative;flex:1}
.sw select{width:100%;border:1.5px solid #ccc;background:#fff;border-radius:10px;padding:9px 28px 9px 11px;font-size:13px;font-family:Inter,sans-serif;color:#111;outline:none;-webkit-appearance:none;cursor:pointer}
.sw::after{content:'▼';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:9px;color:#888;pointer-events:none}
.lbl{font-size:10px;font-weight:700;letter-spacing:2px;color:#aaa;padding:14px 14px 8px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 14px 90px}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1.5px solid #eee;transition:.2s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1);transform:translateY(-2px)}
.cimg{position:relative;width:100%;padding-top:100%;overflow:hidden;background:#f5f5f5;cursor:zoom-in}
.cimg img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.ebox{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:56px}
.ns-ov{position:absolute;inset:0;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;z-index:3}
.ns-lbl{background:#ddd;color:#777;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px}
.cbody{padding:10px}
.cbrand{font-size:10px;font-weight:700;color:#bbb;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
.cname{font-size:12px;font-weight:700;margin-bottom:5px;line-height:1.3}
.ctags{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.ctag{background:#f5f5f5;border:1px solid #eee;border-radius:5px;padding:2px 6px;font-size:10px;color:#555;font-weight:600}
.newp{font-size:15px;font-weight:800}
.psub{font-size:10px;color:#bbb;margin:1px 0 8px}
.abtn{width:100%;background:#111;color:#fff;border:none;border-radius:8px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif}
.abtn:hover{background:#333}
.nsbtn{width:100%;background:#ebebeb;color:#aaa;border:none;border-radius:8px;padding:10px;font-size:12px;font-weight:700;cursor:not-allowed;font-family:Inter,sans-serif}
.qrow{display:flex;align-items:center;border:1.5px solid #111;border-radius:8px;overflow:hidden}
.qb{width:36px;height:36px;border:none;background:#fff;font-size:18px;font-weight:700;cursor:pointer}
.qb:hover{background:#f5f5f5}
.qv{flex:1;text-align:center;font-size:13px;font-weight:700}
.fab{position:fixed;bottom:16px;left:14px;right:14px;background:#111;color:#fff;border:none;border-radius:13px;padding:14px 18px;font-size:14px;font-weight:700;cursor:pointer;display:none;align-items:center;justify-content:space-between;z-index:200;font-family:Inter,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fdot{background:#e01;border-radius:50%;width:22px;height:22px;font-size:11px;display:flex;align-items:center;justify-content:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none}
.ov.on{display:block}
.panel{position:fixed;top:0;right:-480px;width:440px;max-width:100vw;bottom:0;background:#fff;z-index:301;transition:.3s;display:flex;flex-direction:column}
.panel.on{right:0}
.phd{padding:16px 18px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.phd h2{font-size:17px;font-weight:700}
.xbtn{width:34px;height:34px;background:#f0f0f0;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.pbody{flex:1;overflow-y:auto;padding:12px 18px}
.ci{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.ciimg{width:48px;height:48px;border-radius:9px;overflow:hidden;background:#f5f5f5;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.ciimg img{width:100%;height:100%;object-fit:cover}
.cinfo{flex:1}
.ciname{font-size:13px;font-weight:600;margin-bottom:2px}
.ciprice{font-size:12px;font-weight:700}
.pft{padding:14px 18px;border-top:1px solid #eee;background:#fafafa;flex-shrink:0}
.ftrow{display:flex;justify-content:space-between;font-size:13px;color:#888;margin-bottom:5px}
.fttot{display:flex;justify-content:space-between;font-size:17px;font-weight:800;border-top:1px solid #eee;padding-top:9px;margin-top:3px}
.cobtn{width:100%;background:#111;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:11px;font-family:Inter,sans-serif}
.empty{text-align:center;padding:50px 0;color:#ccc}
.mwrap{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none;align-items:flex-end;justify-content:center}
.mwrap.on{display:flex}
.mbox{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.mhd{padding:18px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff}
.mhd h2{font-size:17px;font-weight:700}
.mbd{padding:14px 18px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.fg input,.fg textarea{width:100%;background:#f5f5f5;border:1.5px solid #e5e5e5;border-radius:9px;padding:11px;font-family:Inter,sans-serif;font-size:14px;color:#111;outline:none}
.fg input:focus,.fg textarea:focus{border-color:#111;background:#fff}
.fg textarea{height:60px;resize:none}
.gbtn{width:100%;background:#f0f0f0;border:1.5px solid #e0e0e0;border-radius:8px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;margin-top:6px}
.dinfo{border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:10px;display:none}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.po{background:#f5f5f5;border:1.5px solid #eee;border-radius:9px;padding:9px 4px;text-align:center;cursor:pointer;font-size:11px;font-weight:600;color:#888;transition:.15s}
.po:hover,.po.on{background:#111;border-color:#111;color:#fff}
.po span{display:block;font-size:15px;margin-bottom:2px}
.psum{background:#f5f5f5;border-radius:9px;padding:12px;font-size:13px;margin-top:12px}
.psumr{display:flex;justify-content:space-between;margin-bottom:4px;color:#888}
.psumt{display:flex;justify-content:space-between;font-size:15px;font-weight:800;border-top:1px solid #ddd;padding-top:7px;margin-top:4px}
.mft{padding:10px 18px 22px;display:flex;gap:8px}
.bbk{flex:1;background:#f0f0f0;border:none;border-radius:9px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif}
.bsub{flex:2;background:#111;color:#fff;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif}
.sbox{text-align:center;padding:44px 18px}
.sem{font-size:56px;display:block;margin-bottom:12px}
.sbox h2{font-size:20px;font-weight:800;margin-bottom:7px}
.sbox p{color:#888;font-size:13px;line-height:1.8}
.snum{background:#f5f5f5;border-radius:7px;padding:5px 13px;font-size:13px;font-weight:700;display:inline-block;margin:8px 0}
.nor{grid-column:1/-1;text-align:center;padding:50px;color:#ccc}
.admbtn{position:fixed;bottom:72px;right:14px;background:#555;color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:16px;cursor:pointer;z-index:250;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.admwrap{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;justify-content:center}
.admwrap.on{display:flex}
.admbox{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:18px}
.admttl{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.adi{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;gap:8px}
.adn{font-size:13px;font-weight:600;flex:1}
.adpr{font-size:11px;color:#aaa}
.tgl{position:relative;width:44px;height:24px;flex-shrink:0}
.tgl input{opacity:0;width:0;height:0}
.sldr{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:24px;transition:.3s}
.sldr:before{position:absolute;content:'';height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.sldr{background:#111}
input:checked+.sldr:before{transform:translateX(20px)}
.pbox{display:flex;flex-direction:column;align-items:center;padding:36px 18px;gap:9px}
.pbox input{width:100%;border:1.5px solid #e0e0e0;border-radius:9px;padding:11px;font-size:16px;text-align:center;outline:none;font-family:Inter,sans-serif;letter-spacing:3px}
.lbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:600;display:none;align-items:center;justify-content:center;cursor:pointer}
.lbox.on{display:flex}
.lbox img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:12px}
.lbox-x{position:absolute;top:16px;right:16px;color:#fff;font-size:24px;cursor:pointer;background:rgba(255,255,255,.2);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:0 10px 90px}
  .cname{font-size:11px}.newp{font-size:14px}
  .panel{width:100vw}.flt{top:60px}
  .pgrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

function t(k){return TX[LNG][k]||k;}
function fmt(n){return n.toLocaleString('ru-RU')+" so'm";}
function nm(p){return p.n?p.n[LNG]:p.name||'';}
function getSrc(p){if(!p.img)return null;return IMGS[p.img]||null;}
function stk(id){var s=localStorage.getItem('s'+id);return s===null?true:s==='1';}
function setSt(id,v){localStorage.setItem('s'+id,v?'1':'0');}
function setLang(l,btn){LNG=l;document.querySelectorAll('.ln').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');document.getElementById('srch').placeholder=t('ph');buildF();render();rCart();updF();}
function buildF(){
  var cat=document.getElementById('cat'),cv=cat.value||'all';
  cat.innerHTML=CATS[LNG].map(function(x){return '<option value="'+x[0]+'">'+x[1]+'</option>';}).join('');
  cat.value=cv;
  var br=document.getElementById('brand'),bv=br.value||'all';
  br.innerHTML='<option value="all">'+t('ba')+'</option>'+BRANDS.map(function(b){return '<option value="'+b+'">'+b+'</option>';}).join('');
  br.value=bv;
}
function render(){
  var s=document.getElementById('srch').value.toLowerCase();
  var cat=document.getElementById('cat').value||'all';
  var br=document.getElementById('brand').value||'all';
  var list=PRODS.filter(function(p){return (cat==='all'||p.cat===cat)&&(br==='all'||p.br===br)&&(!s||nm(p).toLowerCase().indexOf(s)>=0);});
  list.sort(function(a,b){return (stk(a.id)?0:1)-(stk(b.id)?0:1);});
  document.getElementById('lbl').textContent=cat==='all'?t('la'):cat.toUpperCase();
  var g=document.getElementById('grid');
  if(!list.length){g.innerHTML='<div class="nor">🔍<p style="margin-top:8px">'+t('ce')+'</p></div>';return;}
  g.innerHTML=list.map(function(p){
    var ci=cart.find(function(c){return c.id===p.id;}),q=ci?ci.qty:0;
    var s2=getSrc(p),stock=stk(p.id);
    var imgH=s2?'<img src="'+s2+'" alt="'+nm(p)+'" loading="lazy" onclick="openLbox(this)" style="cursor:zoom-in">':'<div class="ebox" style="background:linear-gradient(135deg,'+(p.bg||'#eee,#ccc')+')">'+( p.em||'🍦')+'</div>';
    if(!stock)imgH+='<div class="ns-ov"><span class="ns-lbl">'+t('ns')+'</span></div>';
    var tags='<span class="ctag">'+p.w+'</span>'+(p.w2?'<span class="ctag">'+p.w2+'</span>':'');
    var btns=!stock?'<button class="nsbtn">'+t('ns')+'</button>':q>0?'<div class="qrow"><button class="qb" onclick="cq('+p.id+',-1)">−</button><span class="qv">'+q+'</span><button class="qb" onclick="cq('+p.id+',1)">+</button></div>':'<button class="abtn" onclick="ac('+p.id+')">'+t('add')+'</button>';
    return '<div class="card"><div class="cimg">'+imgH+'</div><div class="cbody"><div class="cbrand">'+p.br+'</div><div class="cname">'+nm(p)+'</div><div class="ctags">'+tags+'</div><div class="newp">'+fmt(p.price)+'</div><div class="psub">'+t('up')+'</div>'+btns+'</div></div>';
  }).join('');
}
function openLbox(img){document.getElementById('lboxImg').src=img.src;document.getElementById('lbox').classList.add('on');}
function closeLbox(){document.getElementById('lbox').classList.remove('on');}
function ac(id){if(!stk(id))return;var p=PRODS.find(function(x){return x.id===id;});var ex=cart.find(function(x){return x.id===id;});if(ex)ex.qty++;else cart.push(Object.assign({},p,{qty:1}));upd();}
function cq(id,d){var i=cart.findIndex(function(x){return x.id===id;});if(i<0)return;cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);upd();}
function upd(){render();rCart();updF();}
function updF(){var n=cart.reduce(function(s,i){return s+i.qty;},0);var sum=cart.reduce(function(s,i){return s+i.price*i.qty;},0);document.getElementById('badge').textContent=n;document.getElementById('fn').textContent=n;document.getElementById('ft').textContent=t('fw');document.getElementById('fp').textContent=n?fmt(sum):'';document.getElementById('fab').style.display=n?'flex':'none';}
function openCart(){document.getElementById('panel').classList.add('on');document.getElementById('ov').classList.add('on');rCart();}
function closeCart(){document.getElementById('panel').classList.remove('on');document.getElementById('ov').classList.remove('on');}
function rCart(){
  document.getElementById('ctitle').textContent=t('ct');

  if(!cart.length){body.innerHTML='<div class="empty"><p style="font-size:44px">🛒</p><p style="font-weight:700;margin-top:10px">'+t('ce')+'</p><p style="font-size:13px;color:#bbb;margin-top:5px">'+t('cs')+'</p></div>';ft.innerHTML='';return;}
  var sub=cart.reduce(function(s,i){return s+i.price*i.qty;},0);var tot=cart.reduce(function(s,i){return s+i.qty;},0);
  body.innerHTML=cart.map(function(c){var s2=getSrc(c);return '<div class="ci"><div class="ciimg">'+(s2?'<img src="'+s2+'" alt="'+nm(c)+'">':(c.em||'🍦'))+'</div><div class="cinfo"><div class="ciname">'+nm(c)+'</div><div class="ciprice">'+fmt(c.price*c.qty)+'</div></div><div class="qrow" style="width:100px;flex-shrink:0"><button class="qb" onclick="cq('+c.id+',-1)">−</button><span class="qv">'+c.qty+'</span><button class="qb" onclick="cq('+c.id+',1)">+</button></div></div>';}).join('');
  ft.innerHTML='<div class="ftrow"><span>'+t('gd')+' ('+tot+')</span><span style="font-weight:700;color:#111">'+fmt(sub)+'</span></div><div class="ftrow"><span>'+t('dl')+'</span><span>'+(dCost?fmt(dCost):t('cl'))+'</span></div><div class="fttot"><span>'+t('tt')+'</span><span>'+fmt(sub+dCost)+'</span></div><button class="cobtn" onclick="openOrder()">'+t('ob')+'</button>';
}

}
function selP(el){document.querySelectorAll('.po').forEach(function(e){e.classList.remove('on');});el.classList.add('on');}
function doGeo(){
  if(!navigator.geolocation){alert(t('gn'));return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lng=pos.coords.longitude;
    var dL=(41.5533-lat)*Math.PI/180,dN=(60.6239-lng)*Math.PI/180;
    var a=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(lat*Math.PI/180)*Math.cos(41.5533*Math.PI/180)*Math.sin(dN/2)*Math.sin(dN/2);
    var dist=6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    dCost=dist>15?0:dist>10?15000:dist>5?10000:5000;
    var fa=document.getElementById('fa2');if(fa)fa.value=lat.toFixed(4)+', '+lng.toFixed(4);
    var di=document.getElementById('di2');
    if(di){di.style.display='block';if(dCost){di.textContent=t('iz')+' - '+fmt(dCost)+' - '+dist.toFixed(1)+' km';di.style.cssText='display:block;background:#e8f4ff;border:1px solid #b3d9ff;color:#1a6fa8;border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:10px';}else{di.textContent=t('oz');di.style.cssText='display:block;background:#fff0f0;border:1px solid #ffcccc;color:#cc0000;border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:10px';}}
    rCart();
  },function(){alert(t('gf'));});
}
function doOrder(){
  var n=(document.getElementById('fn2')||{}).value.trim();
  var p=(document.getElementById('fp2')||{}).value.trim();
  var a=(document.getElementById('fa2')||{}).value.trim();
  if(!n||!p||!a){alert(t('fa'));return;}
  var items=cart.map(function(c){return nm(c)+' x'+c.qty+' = '+fmt(c.price*c.qty);}).join('\n');
  var sub=cart.reduce(function(s,i){return s+i.price*i.qty;},0);
  var oid='#AIC'+Date.now().toString().slice(-6);
  var pay=document.querySelector('.po.on');
  var BOT='8822876663:AAFkkr20kiLl4rDwnNb56WvSgU6K61p3Fp4';
  var CID='7623130537';
  var mapLink=a.indexOf(',')>0?'https://maps.google.com/?q='+a:'';
  var msgText='🏪 Airport Icecream\n🛒 Buyurtma '+oid+'\n\n👤 '+n+'\n📱 '+p+'\n📍 '+a+(mapLink?'\n🗺 '+mapLink:'')+'\n\n🍦 Mahsulotlar:\n'+items+'\n\n💰 Jami: '+fmt(sub+dCost);
  fetch('https://api.telegram.org/bot'+BOT+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CID,text:msgText})});
  cart=[];dCost=0;updF();rCart();render();
  document.getElementById('mbox').innerHTML='<div class="sbox"><span class="sem">🎉</span><h2>'+t('dt')+'</h2><div class="snum">'+t('ow')+' '+oid+'</div><p>👤 '+n+'<br>📱 '+p+'<br>📍 '+a+'<br><br>📦 '+t('dd')+'</p><button class="bsub" onclick="closeM()" style="margin-top:16px;padding:11px 26px;width:auto">'+t('db')+'</button></div>';
}
